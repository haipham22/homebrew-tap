name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  audit:
    name: audit casks
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: Homebrew/actions/setup-homebrew@6315ef70a8bfcd2c71104383846591ac113ace33
      - name: Register this checkout as the tap
        run: |
          TAP_DIR="$(brew --repository haipham22/tap)"
          mkdir -p "$(dirname "$TAP_DIR")"
          ln -s "$GITHUB_WORKSPACE" "$TAP_DIR"
      - name: Install bubblewrap (brew sandbox on Linux)
        run: sudo apt-get update && sudo apt-get install -y bubblewrap
      - name: Detect changed casks
        env:
          BEFORE_SHA: ${{ github.event.before }}
          BASE_REF: ${{ github.base_ref }}
        run: |
          file="${RUNNER_TEMP}/changed-casks.txt"
          : > "$file"

          if [[ "$GITHUB_EVENT_NAME" == "pull_request" ]]; then
            base="origin/${BASE_REF}"
            git diff --name-only "${base}...HEAD" -- 'Casks/*.rb' | sort -u > "$file"
          elif git cat-file -e "${BEFORE_SHA}^{commit}" 2>/dev/null; then
            git diff --name-only "${BEFORE_SHA}" HEAD -- 'Casks/*.rb' | sort -u > "$file"
          elif git rev-parse -q --verify HEAD^ >/dev/null; then
            git diff --name-only HEAD^ HEAD -- 'Casks/*.rb' | sort -u > "$file"
          else
            git ls-files 'Casks/*.rb' | sort -u > "$file"
          fi

          while IFS= read -r file_path; do
            [[ -n "$file_path" && -f "$file_path" ]] || continue
          done < "$file"
          cat "$file"

      - name: Audit changed casks
        run: |
          while IFS= read -r file_path; do
            [[ -n "$file_path" ]] || continue
            cask="$(basename "$file_path" .rb)"
            brew audit --cask --online "haipham22/tap/$cask"
          done < "${RUNNER_TEMP}/changed-casks.txt"

  install-ubuntu:
    name: install + launch probe (Ubuntu)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: Homebrew/actions/setup-homebrew@6315ef70a8bfcd2c71104383846591ac113ace33
      - name: Register this checkout as the tap
        run: |
          TAP_DIR="$(brew --repository haipham22/tap)"
          mkdir -p "$(dirname "$TAP_DIR")"
          ln -s "$GITHUB_WORKSPACE" "$TAP_DIR"
      - name: Install system libs + xvfb (common Ubuntu launch deps)
        run: |
          sudo apt-get update
          sudo apt-get install -y bubblewrap xvfb \
            libxtst6 libxrender1 libxi6 libxss1 libnss3 libnspr4 \
            libasound2t64 libgbm1 libdrm2 libxkbcommon0 libfontconfig1
      - name: Detect changed casks
        env:
          BEFORE_SHA: ${{ github.event.before }}
          BASE_REF: ${{ github.base_ref }}
        run: |
          file="${RUNNER_TEMP}/changed-casks.txt"
          : > "$file"

          if [[ "$GITHUB_EVENT_NAME" == "pull_request" ]]; then
            base="origin/${BASE_REF}"
            git diff --name-only "${base}...HEAD" -- 'Casks/*.rb' | sort -u > "$file"
          elif git cat-file -e "${BEFORE_SHA}^{commit}" 2>/dev/null; then
            git diff --name-only "${BEFORE_SHA}" HEAD -- 'Casks/*.rb' | sort -u > "$file"
          elif git rev-parse -q --verify HEAD^ >/dev/null; then
            git diff --name-only HEAD^ HEAD -- 'Casks/*.rb' | sort -u > "$file"
          else
            git ls-files 'Casks/*.rb' | sort -u > "$file"
          fi

          cat "$file"

      - name: Install changed casks + launch probe (fails on sandbox crash)
        env:
          HOMEBREW_NO_AUTO_UPDATE: 1
        run: |
          set -uo pipefail
          fail=0
          probe() {
            local cask="$1" bin="$2"
            grep -Fxq "Casks/${cask}.rb" "${RUNNER_TEMP}/changed-casks.txt" || return 0
            echo "===== $cask (bin: $bin) ====="
            brew install --cask "haipham22/tap/$cask" 2>&1 | tail -4
            echo "--- launch probe ---"
            local out
            out=$(timeout 25 xvfb-run -a "$bin" --version 2>&1 | head -25 || true)
            echo "$out"
            if printf '%s' "$out" | grep -qiE 'setuid_sandbox_host|Trace/breakpoint trap|FATAL:sandbox'; then
              echo "::error::$cask still crashes (SUID sandbox not configured)"
              fail=1
            fi
            echo
          }
          probe 1password-gui-linux       1password
          probe antigravity-linux         antigravity
          probe antigravity-ide-linux     antigravity-ide
          probe fmess                     fmess
          probe jetbrains-toolbox-linux   jetbrains-toolbox
          probe jivedb                    jivedb
          probe orca                      orca-ide
          probe saint                     saint
          probe teams-for-linux           teams-for-linux
          probe visual-studio-code-linux  code
          exit "$fail"
