name: autobump

on:
  workflow_dispatch:
  schedule:
    # daily at 03:17 UTC (off the :00 mark)
    - cron: "17 3 * * *"

permissions:
  contents: write
  pull-requests: write

jobs:
  bump-linux:
    runs-on: ubuntu-24.04
    steps:
      - name: Set up Homebrew
        uses: Homebrew/actions/setup-homebrew@6315ef70a8bfcd2c71104383846591ac113ace33

      - name: Configure git
        uses: Homebrew/actions/git-user-config@6315ef70a8bfcd2c71104383846591ac113ace33

      - name: Checkout homebrew-core (cross-reference for brew bump)
        uses: actions/checkout@v5
        with:
          repository: Homebrew/homebrew-core
          path: homebrew-core
          fetch-depth: 1
          sparse-checkout: |
            Formula/

      - name: Move homebrew-core to tap directory
        run: |
          BREW_REPO="$(brew --repo)"
          CORE_TAP="$BREW_REPO/Library/Taps/homebrew/homebrew-core"
          mkdir -p "$(dirname "$CORE_TAP")"
          rm -rf "$CORE_TAP"
          mv homebrew-core "$CORE_TAP"

      - name: Bump outdated casks (push branches)
        # `--open-pr` pushes a bump-<cask>-<ver> branch per outdated cask and
        # opens its own PR when it can. `|| true` so the merge step still runs.
        env:
          HOMEBREW_DEVELOPER: 1
          HOMEBREW_GITHUB_API_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: brew bump --tap ${{ github.repository }} --open-pr --no-fork || true

  bump-macos:
    runs-on: macos-15
    steps:
      - name: Set up Homebrew
        uses: Homebrew/actions/setup-homebrew@6315ef70a8bfcd2c71104383846591ac113ace33

      - name: Configure git
        uses: Homebrew/actions/git-user-config@6315ef70a8bfcd2c71104383846591ac113ace33

      - name: Bump multi-OS casks (orca, saint)
        # brew bump cannot be used for these two: (1) they ship macOS dmg +
        # Linux AppImage in one cask, and on a Linux runner its macOS
        # checksums are computed from the AppImage download, so brew style
        # rejects the identical hashes; (2) brew bump hands bump-cask-pr a
        # bare token, and bare "orca" resolves to homebrew/cask's disabled
        # plotly cask whose URL then 404s — a tap-qualified name dodges both.
        env:
          HOMEBREW_DEVELOPER: 1
          HOMEBREW_GITHUB_API_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -uo pipefail
          for cask in orca saint; do
            full="haipham22/tap/$cask"
            state="$(brew livecheck --cask "$full" --json 2>/dev/null | jq -r '.[0].version // "{}"')"
            cur="$(jq -r '.current // ""' <<<"$state")"
            latest="$(jq -r '.latest // ""' <<<"$state")"
            if [[ -z "$latest" ]]; then
              echo "::warning::$cask: livecheck found no version, skipping"
              continue
            fi
            if [[ "$latest" == "$cur" ]]; then
              echo "$cask: up to date ($cur)"
              continue
            fi
            echo "$cask: bumping $cur -> $latest"
            brew bump-cask-pr "$full" --version="$latest" --no-fork --no-browse \
              --message="Created by \`brew bump\`." \
              || echo "::warning::$cask: bump-cask-pr failed, left for next run"
          done

  merge-prs:
    needs: [bump-linux, bump-macos]
    # One bump job failing shouldn't strand the other job's branches.
    if: ${{ !cancelled() }}
    runs-on: ubuntu-24.04
    steps:
      - name: Merge PRs for bump-* branches (gh fallback)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          for b in $(gh api "repos/${{ github.repository }}/branches" --jq '.[].name' | grep '^bump-'); do
            if ! gh pr list --repo "${{ github.repository }}" --head "$b" --state open --json number | grep -q number; then
              echo "Opening PR for $b"
              gh pr create --repo "${{ github.repository }}" --head "$b" --base main \
                --title "$b" --body "Automated version bump via \`brew bump\`." \
                || { echo "::warning::gh pr create failed for $b"; continue; }
            fi
            echo "Merging PR for $b"
            # GITHUB_TOKEN PRs don't trigger workflows, so the PR checks stay
            # empty — merge immediately; tests.yml runs on push to main.
            gh pr merge "$b" --repo "${{ github.repository }}" --squash --delete-branch \
              || echo "::warning::merge failed for $b (PR left open)"
          done
