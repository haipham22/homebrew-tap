name: autobump

on:
  workflow_dispatch:
  schedule:
    # daily at 03:17 UTC (off the :00 mark)
    - cron: "17 3 * * *"

permissions:
  contents: write
  pull-requests: write

jobs:
  bump-linux:
    runs-on: ubuntu-24.04
    steps:
      - name: Set up Homebrew
        uses: Homebrew/actions/setup-homebrew@6315ef70a8bfcd2c71104383846591ac113ace33

      - name: Configure git
        uses: Homebrew/actions/git-user-config@6315ef70a8bfcd2c71104383846591ac113ace33

      - name: Checkout homebrew-core (cross-reference for brew bump)
        uses: actions/checkout@v5
        with:
          repository: Homebrew/homebrew-core
          path: homebrew-core
          fetch-depth: 1
          sparse-checkout: |
            Formula/

      - name: Move homebrew-core to tap directory
        run: |
          BREW_REPO="$(brew --repo)"
          CORE_TAP="$BREW_REPO/Library/Taps/homebrew/homebrew-core"
          mkdir -p "$(dirname "$CORE_TAP")"
          rm -rf "$CORE_TAP"
          mv homebrew-core "$CORE_TAP"

      - name: Bump Linux-only casks (push branches)
        # Saint and Orca are handled by bump-macos because their casks contain
        # checksums for both platforms. `brew bump-cask-pr` computes only the
        # checksums for the runner platform, leaving the other platform stale.
        env:
          HOMEBREW_DEVELOPER: 1
          HOMEBREW_GITHUB_API_TOKEN: ${{ secrets.AUTOBUMP_PAT || secrets.GITHUB_TOKEN }}
        run: |
          brew bump --tap "${{ github.repository }}" --cask --open-pr --no-fork \
            1password-gui-linux \
            antigravity-ide-linux \
            antigravity-linux \
            fmess \
            jetbrains-toolbox-linux \
            jivedb \
            teams-for-linux \
            visual-studio-code-linux

  bump-macos:
    runs-on: macos-15
    steps:
      - name: Set up Homebrew
        uses: Homebrew/actions/setup-homebrew@6315ef70a8bfcd2c71104383846591ac113ace33

      - name: Configure git
        uses: Homebrew/actions/git-user-config@6315ef70a8bfcd2c71104383846591ac113ace33

      - uses: actions/checkout@v5
        with:
          token: ${{ secrets.AUTOBUMP_PAT || secrets.GITHUB_TOKEN }}

      - name: Register this checkout as the tap
        run: |
          TAP_DIR="$(brew --repository haipham22/tap)"
          rm -rf "$TAP_DIR"
          mkdir -p "$(dirname "$TAP_DIR")"
          ln -s "$GITHUB_WORKSPACE" "$TAP_DIR"

      - name: Update multi-OS casks with all platform checksums
        env:
          GH_TOKEN: ${{ secrets.AUTOBUMP_PAT || secrets.GITHUB_TOKEN }}
        run: |
          set -uo pipefail
          failed=0
          for cask in orca saint; do
            if bash .github/scripts/update-multi-os-cask.sh --cask "$cask"; then
              continue
            fi
            echo "::warning::$cask: multi-OS update failed"
            failed=1
          done
          exit "$failed"

  merge-prs:
    needs: [bump-linux, bump-macos]
    # One bump job failing shouldn't strand the other job's branches.
    if: ${{ !cancelled() }}
    runs-on: ubuntu-24.04
    steps:
      - name: Merge bump PRs after checks
        env:
          GH_TOKEN: ${{ secrets.AUTOBUMP_PAT || secrets.GITHUB_TOKEN }}
        run: |
          mapfile -t rows < <(
            gh pr list --repo "${{ github.repository }}" --state open --json number,headRefName \
              --jq '.[] | select(.headRefName | startswith("bump-")) | [.number, .headRefName] | @tsv'
          )
          failed=0
          for row in "${rows[@]}"; do
            number="${row//$'\t'*}"
            branch="${row#*$'\t'}"
            echo "Waiting for #$number ($branch)"
            if ! gh pr checks "$number" --repo "${{ github.repository }}" --watch --interval 30 --fail-fast; then
              echo "::error::checks failed for #$number"
              failed=1
              continue
            fi
            merged=false
            for _ in 1 2 3; do
              if gh pr merge "$number" --repo "${{ github.repository }}" --squash --delete-branch; then
                merged=true
                break
              fi
              sleep 10
            done
            if [[ "$merged" != true ]]; then
              echo "::error::could not merge #$number"
              failed=1
            fi
          done
          exit "$failed"
