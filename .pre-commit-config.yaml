repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-yaml
      - id: trailing-whitespace
      - id: end-of-file-fixer

  - repo: local
    hooks:
      - id: actionlint
        name: actionlint (GitHub Workflows)
        entry: actionlint
        language: system
        files: ^\.github/workflows/.*\.ya?ml$

      - id: brew-style
        name: brew style (casks)
        entry: brew style
        language: system
        files: (^|/)Casks/.*\.rb$
